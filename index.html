<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AKovArt | Портфолио</title>
</head>
<body style="background-color: #ededed; font-family: Arial, sans-serif; margin: 0; padding: 40px;">

    <!-- Главный контейнер-планшет -->
    <div style="background-color: #f9f9f9; max-width: 900px; margin: 0 auto; padding: 40px; border-radius: 20px; border: 1px solid #dcdcdc;">
        
        <!-- Шапка сайта -->
        <table width="100%" cellspacing="0" cellpadding="0" style="margin-bottom: 40px;">
            <tr>
                <td style="font-weight: bold; font-size: 18px; letter-spacing: 2px;">AKovArt <span style="color: #aaa; font-weight: normal;">| PORTFOLIO</span></td>
                <td align="right" style="font-size: 13px; font-weight: bold; letter-spacing: 1px;">
                    <span style="color: #000; border-bottom: 2px solid #54a0ff; padding-bottom: 4px; margin-right: 15px;">РАБОТЫ</span>
                    <span style="color: #777; margin-right: 15px;">ОБО МНЕ</span>
                    <span style="color: #777;">КОНТАКТЫ</span>
                </td>
            </tr>
        </table>

        <!-- Основная часть из двух колонок -->
        <table width="100%" cellspacing="0" cellpadding="0">
            <tr>
                <!-- Левая колонка: Большая карточка -->
                <td width="50%" valign="top" align="center">
                    <div style="background-color: #ffffff; padding: 15px; border: 1px solid #e0e0e0; border-radius: 4px; width: 350px; text-align: center;">
                        <div style="width: 350px; height: 350px; background-color: #e9e9e9; border: 1px dashed #ccc; border-radius: 2px; font-size: 14px; color: #888; font-weight: bold; padding-top: 150px; box-sizing: border-box;">
                            <div style="font-size: 28px; margin-bottom: 10px; color: #bbb;">✦</div>
                            ГЛАВНАЯ РАБОТА
                        </div>
                        <div style="margin-top: 15px; font-size: 12px; letter-spacing: 3px; color: #555; font-weight: bold;">ETHERBOUND</div>
                    </div>
                </td>
                
                <!-- Правая колонка: Текст и миниатюры -->
                <td width="50%" valign="middle" style="padding-left: 40px;">
                    <h1 style="font-family: 'Times New Roman', Times, serif; font-size: 42px; font-weight: normal; letter-spacing: 2px; margin: 0 0 20px 0; text-transform: uppercase;">AKovArt</h1>
                    
                    <p style="color: #666; font-size: 15px; line-height: 1.6; margin: 0 0 30px 0;">
                        Добро пожаловать в мою творческую галерею. Здесь исследуется тонкий танец света, теней и уникальных визуальных историй.
                    </p>
                    
                    <!-- Миниатюры (таблица 2х2) -->
                    <table cellspacing="10" cellpadding="0" style="margin-bottom: 30px; margin-left: -10px;">
                        <tr>
                            <td><div style="width: 70px; height: 70px; background-color: #eaeaea; border: 1px dashed #ddd; border-radius: 8px; text-align: center; color: #999; font-size: 11px; font-weight: bold; padding-top: 25px; box-sizing: border-box;">Арт 1</div></td>
                            <td><div style="width: 70px; height: 70px; background-color: #eaeaea; border: 1px dashed #ddd; border-radius: 8px; text-align: center; color: #999; font-size: 11px; font-weight: bold; padding-top: 25px; box-sizing: border-box;">Арт 2</div></td>
                        </tr>
                        <tr>
                            <td><div style="width: 70px; height: 70px; background-color: #eaeaea; border: 1px dashed #ddd; border-radius: 8px; text-align: center; color: #999; font-size: 11px; font-weight: bold; padding-top: 25px; box-sizing: border-box;">Арт 3</div></td>
                            <td><div style="width: 70px; height: 70px; background-color: #eaeaea; border: 1px dashed #ddd; border-radius: 8px; text-align: center; color: #999; font-size: 11px; font-weight: bold; padding-top: 25px; box-sizing: border-box;">Арт 4</div></td>
                        </tr>
                    </table>
                    
                    <!-- Кнопка -->
                    <div style="display: inline-block; padding: 12px 28px; border: 1px solid #111; background-color: transparent; color: #111; text-decoration: none; border-radius: 4px; font-size: 11px; letter-spacing: 2px; font-weight: bold; text-transform: uppercase;">
                        Подробнее
                    </div>
                </td>
            </tr>
        </table>
        
    </div>

</body>
</html>
