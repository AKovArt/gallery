<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKov | Портфолио </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Корпус планшета -->
    <div class="tablet-frame">
        <!-- Боковые элементы планшета (как на референсе) -->
        <div class="tablet-speakers">
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="tablet-button"></div>

        <!-- Сам сайт (экран планшета) -->
        <div class="site-container">
            <!-- Шапка сайта -->
            <header class="header">
                <div class="logo">AKov <span>| Портфолио </span></div>
                <nav class="nav">
                    <a href="#">ДОМОЙ</a>
                    <a href="#" class="active">РАБОТЫ</a>
                    <a href="#">ОБО МНЕ</a>
                    <a href="#">КОНТАКТЫ</a>
                </nav>
            </header>

            <!-- Основной контент -->
            <main class="main-content">
                <div class="hero-image-placeholder">
                    <span>[ Большое изображение: ETHERBOUND ]</span>
                </div>

                <div class="hero-text-content">
                    <h1> Александра Коваль </h1>
                    <p class="description">
                        Создаю визуальные миры, которые рассказывают истории, цепляют за живое и заставляют разглядывать каждую деталь
                    </p>

                    <div class="thumbnails-grid">
                        <div class="thumb-placeholder"><span>Арт 1</span></div>
                        <div class="thumb-placeholder"><span>Арт 2</span></div>
                        <div class="thumb-placeholder"><span>Арт 3</span></div>
                        <div class="thumb-placeholder"><span>Арт 4</span></div>
                    </div>

                    <a href="#" class="btn-details">PORTFOLIO DETAILS</a>
                </div>
            </main>

            <!-- Подвал -->
            <footer class="footer">
                <div class="socials">
                    <a href="#">IG</a>
                    <a href="#">A</a>
                    <a href="#">TW</a>
                </div>
                <div class="scrolling-gallery">
                    <span class="scroll-icon"></span> SCROLLING GALLERY
                </div>
                <div class="arrow-right">→</div>
            </footer>
        </div>
    </div>

</body>
</html>
