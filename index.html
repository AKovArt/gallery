<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Lyra Nocturna</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем изящный шрифт с Google Fonts, похожий на дизайн -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="site-container">
        <!-- Шапка сайта -->
        <header class="header">
            <div class="logo">AURA <span>| LYRA NOCTURNA</span></div>
            <nav class="nav">
                <a href="#">HOME</a>
                <a href="#" class="active">WORKS</a>
                <a href="#">ABOUT</a>
                <a href="#">CONTACT</a>
            </nav>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Левая колонка: Большая картинка (заменена текстом) -->
            <div class="hero-image-placeholder">
                <span>[ Большое изображение: ETHERBOUND ]</span>
            </div>

            <!-- Правая колонка: Текст и миниатюры -->
            <div class="hero-text-content">
                <h1>LYRA NOCTURNA</h1>
                <p class="description">
                    Explore the delicate dance of light and shadow, and the stories they weave. Digital Artistry by Lyra Nocturna.
                </p>

                <!-- Сетка из 4 миниатюр (заменены текстом) -->
                <div class="thumbnails-grid">
                    <div class="thumb-placeholder"><span>Арт 1</span></div>
                    <div class="thumb-placeholder"><span>Арт 2</span></div>
                    <div class="thumb-placeholder"><span>Арт 3</span></div>
                    <div class="thumb-placeholder"><span>Арт 4</span></div>
                </div>

                <a href="#" class="btn-details">PORTFOLIO DETAILS</a>
            </div>
        </main>

        <!-- Подвал -->
        <footer class="footer">
            <div class="socials">
                <a href="#">IG</a>
                <a href="#">A</a>
                <a href="#">TW</a>
            </div>
            <div class="scrolling-gallery">
                <span class="scroll-icon"></span> SCROLLING GALLERY
            </div>
            <div class="arrow-right">→</div>
        </footer>
    </div>

</body>
</html>
