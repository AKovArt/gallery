<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKovArt — Галерея работ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; }
        h1 { color: #ff4757; font-size: 2.5em; }
        p { color: #ccc; font-size: 1.2em; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 40px auto; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .placeholder { width: 100%; height: 200px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #666; }
    </style>
</head>
<body>
    <h1>Арт-Галерея AKovArt</h1>
    <p>Добро пожаловать на мой второй сайт-портфолио!</p>
    
    <div class="gallery">
        <div class="card"><div class="placeholder">Здесь будет работа 1</div></div>
        <div class="card"><div class="placeholder">Здесь будет работа 2</div></div>
        <div class="card"><div class="placeholder">Здесь будет работа 3</div></div>
    </div>
</body>
</html>
